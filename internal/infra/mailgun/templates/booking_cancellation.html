<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva cancelada</title>
</head>
<body style="margin:0;padding:0;background:#f4f7f5;font-family:Arial,Helvetica,sans-serif;color:#0f172a;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f7f5;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #e2e8f0;">
          <tr>
            <td align="center" style="background:#0d1b3a;padding:28px 24px;">
              <a href="{{.HomeURL}}" target="_blank" style="text-decoration:none;">
                <img src="{{.LogoURL}}" alt="ReservaloYA" width="220" style="display:block;width:220px;max-width:100%;height:auto;border:0;margin:0 auto;">
              </a>
              <p style="margin:12px 0 0;color:#cbd5e1;font-size:13px;">{{.CenterName}}</p>
            </td>
          </tr>
          <tr>
            <td style="height:5px;background:#16e6a1;font-size:0;line-height:0;">&nbsp;</td>
          </tr>
          <tr>
            <td style="padding:32px 28px;">
              <p style="margin:0 0 12px;font-size:16px;">Hola {{.CustomerName}},</p>
              <p style="margin:0 0 20px;font-size:14px;line-height:1.6;color:#334155;">
                Tu reserva fue cancelada. Estos son los detalles:
              </p>
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;margin:0 0 20px;">
                <tr><td style="padding:16px 20px;font-size:14px;line-height:1.9;color:#334155;">
                  <strong>Código:</strong> {{.BookingCode}}<br>
                  <strong>Cancha:</strong> {{.SpaceName}}<br>
                  <strong>Fecha:</strong> {{.Date}}<br>
                  <strong>Horario:</strong> {{.Hour}}<br>
                  <strong>Precio:</strong> {{.Price}}
                </td></tr>
              </table>
              <p style="margin:0;text-align:center;">
                <a href="{{.HomeURL}}" style="display:inline-block;background:#16e6a1;color:#071b16;text-decoration:none;padding:12px 24px;border-radius:10px;font-size:14px;font-weight:bold;">Reservar nuevamente</a>
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:18px 28px;background:#f8fafc;border-top:1px solid #e2e8f0;">
              <p style="margin:0;font-size:12px;color:#94a3b8;">Este es un correo automático, no respondas a este mensaje.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
